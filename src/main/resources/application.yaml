spring:
  application:
    name: Smart_Cold_Storage_Monitor
  sql:
    init:
      # schema.sql is idempotent (IF NOT EXISTS only), so running it on every startup never resets data.
      mode: always
      continue-on-error: false

# OpenAPI document at /v3/api-docs, Swagger UI at /swagger-ui.html (see config/OpenApiConfig).
# Set APP_API_DOCS_ENABLED=false to turn both off.
springdoc:
  api-docs:
    enabled: ${APP_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${APP_API_DOCS_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: alpha
  paths-to-match: /api/**
  default-produces-media-type: application/json

server:
  # The local demonstration binds to localhost only (design doc §7).
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # Set to true when HTTPS is enabled.
        secure: false

app:
  database:
    path: ./data/smart-cold-storage.db
    busy-timeout-ms: 5000
    max-pool-size: 4
  # Initial administrator, created on startup only when no ADMIN account exists.
  # Defaults: username "admin", password "12345678" (change it after the first sign-in).
  # To choose them, set APP_BOOTSTRAP_ADMIN_USERNAME / APP_BOOTSTRAP_ADMIN_PASSWORD.
  # Never commit real credentials here.
  # bootstrap:
  #   admin:
  #     username:
  #     password:

  monitoring:
    inventory-path: ./testData/ColdStorage_Demo/cold_storage_demo.sqlite
    sensor-path: ./testData/SHT45_30min/monitoring_timestamped.jsonl
    stale-after: 30s
    expiring-soon: 24h
    max-sensor-file-bytes: 10000000
    # Configure location code -> device ID; no implicit cross-zone sharing.
    location-devices: {}
