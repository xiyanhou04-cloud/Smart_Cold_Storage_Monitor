spring:
  application:
    name: Smart_Cold_Storage_Monitor
  sql:
    init:
      # schema.sql is idempotent (IF NOT EXISTS only), so running it on every startup never resets data.
      mode: always
      continue-on-error: false

# OpenAPI document at /v3/api-docs, Swagger UI at /swagger-ui.html (see config/OpenApiConfig).
# Set APP_API_DOCS_ENABLED=false to turn both off.
springdoc:
  api-docs:
    enabled: ${APP_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${APP_API_DOCS_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: alpha
  paths-to-match: /api/**
  default-produces-media-type: application/json

server:
  # The local demonstration binds to localhost only (design doc §7).
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # Set to true when HTTPS is enabled.
        secure: false

app:
  database:
    path: ./data/smart-cold-storage.db
    busy-timeout-ms: 5000
    max-pool-size: 4
  # Initial administrator, created on startup only when no ADMIN account exists.
  # Defaults: username "admin", password "12345678" (change it after the first sign-in).
  # To choose them, set APP_BOOTSTRAP_ADMIN_USERNAME / APP_BOOTSTRAP_ADMIN_PASSWORD.
  # Never commit real credentials here.
  # bootstrap:
  #   admin:
  #     username:
  #     password:

  # Device ingestion (POST /api/readings). Tokens are HMAC-SHA256(device secret, device id).
  # Set APP_DEVICE_SECRET (at least 16 characters) to let an external simulator post readings;
  # when it is unset, a random secret is generated for each run and only the built-in simulator can post.
  # clear-readings-on-startup empties the readings table on every start (devices, sessions and audit
  # events are kept). Set APP_READINGS_CLEAR_ON_STARTUP=false to keep readings across restarts.
  ingestion:
    device-secret: ${APP_DEVICE_SECRET:}
    clear-readings-on-startup: ${APP_READINGS_CLEAR_ON_STARTUP:true}
  # Built-in sensor simulator: on startup it registers each device in the scenario file, makes sure
  # it has an active storage session, and then posts one reading per device every interval, forever,
  # stamped with the send time. APP_SIMULATOR_ENABLED=false stops only the sending loop: devices
  # and sessions are still provisioned so an external simulator (same APP_DEVICE_SECRET) can post.
  simulator:
    enabled: ${APP_SIMULATOR_ENABLED:true}
    data: ./data/monitoring_timestamped.jsonl
    interval: 5s
    devices: []

  # Default threshold limits (FR-04). Every new storage session starts with the limits of its device's
  # location_code; a device without a known location gets the fallback. Users change them later through
  # PUT /api/settings/thresholds/{deviceId}. The location values are the zone targets of the
  # seven-zone demo inventory (testData/SevenZone_Demo/cold_storage_demo.sqlite, table locations).
  # Keep map keys in brackets so the location code is bound exactly as written.
  thresholds:
    fallback:          { temperature-lower-c: 0.0,   temperature-upper-c: 8.0,   humidity-lower-pct: 30.0, humidity-upper-pct: 95.0 }
    locations:
      "[VEG-COLD]":         { temperature-lower-c: 0.0,   temperature-upper-c: 2.2,   humidity-lower-pct: 95.0, humidity-upper-pct: 98.0 }
      "[VEG-COOL]":         { temperature-lower-c: 10.0,  temperature-upper-c: 12.2,  humidity-lower-pct: 90.0, humidity-upper-pct: 95.0 }
      "[RAW-MEAT]":         { temperature-lower-c: 0.0,   temperature-upper-c: 4.0,   humidity-lower-pct: 55.0, humidity-upper-pct: 80.0 }
      "[EGGS]":             { temperature-lower-c: 0.0,   temperature-upper-c: 4.0,   humidity-lower-pct: 55.0, humidity-upper-pct: 80.0 }
      "[FROZEN]":           { temperature-lower-c: -25.0, temperature-upper-c: -18.0, humidity-lower-pct: 35.0, humidity-upper-pct: 80.0 }
      "[FRUIT-COLD-BERRY]": { temperature-lower-c: -0.5,  temperature-upper-c: 0.5,   humidity-lower-pct: 90.0, humidity-upper-pct: 95.0 }
      "[FRUIT-TROPICAL]":   { temperature-lower-c: 13.0,  temperature-upper-c: 14.0,  humidity-lower-pct: 90.0, humidity-upper-pct: 95.0 }

  monitoring:
    inventory-path: ./testData/ColdStorage_Demo/cold_storage_demo.sqlite
    sensor-path: ./testData/SHT45_30min/monitoring_timestamped.jsonl
    stale-after: 30s
    expiring-soon: 24h
    max-sensor-file-bytes: 10000000
    # Configure location code -> device ID; no implicit cross-zone sharing.
    location-devices: {}
