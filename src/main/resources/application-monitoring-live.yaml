# Local seven-zone live telemetry simulation.
app:
  monitoring:
    inventory-path: ./testData/SevenZone_Demo/cold_storage_demo.sqlite
    sensor-path: ./testData/SevenZone_Demo/monitoring_timestamped.jsonl
    location-devices:
      RAW-MEAT: ESP32-SIM-001
      VEG-COLD: ESP32-SIM-002
      VEG-COOL: ESP32-SIM-003
      EGGS: ESP32-SIM-004
      FROZEN: ESP32-SIM-005
      FRUIT-COLD-BERRY: ESP32-SIM-006
      FRUIT-TROPICAL: ESP32-SIM-007
  telemetry:
    database-path: ./data/live-telemetry.sqlite
    tick-ms: 5000
    device-secret: ${APP_TELEMETRY_DEVICE_SECRET:}
